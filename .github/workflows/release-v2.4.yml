name: Release 2.4 maintenance

on:
  push:
    branches:
      - maintenance/v2.4.1

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release v2.4.1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff hygiene
        run: git diff --check

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.4.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file RELEASE_NOTES_v2.4.1.md
          fi
          gh release view "$TAG" --json tagName,targetCommitish,publishedAt,url
