name: Release 2.4 maintenance

on:
  push:
    branches:
      - maintenance/v2.4.1

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release v2.4.1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: leanprover/lean-action@v1

      - name: Publication audit
        run: lake env lean EverettianProbability/Audit/PublicationCore.lean

      - name: Source guard
        run: bash scripts/guard.sh

      - name: Diff hygiene
        run: git diff --check

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.4.1"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file RELEASE_NOTES_v2.4.1.md
          gh release view "$TAG" --json tagName,targetCommitish,publishedAt,url
