name: Publish v2.4.0 journal audit release

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-v2.4.0-journal-audit.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and verify exact annotated tag
        env:
          TAG: v2.4.0-journal-audit
          TARGET: b027ee9cd310514ddb33b9c8af8b35a24cbe5d7f
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/tmp/tag-ref 2>/dev/null; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            ACTUAL="$(git rev-list -n 1 "${TAG}")"
            if [ "${ACTUAL}" != "${TARGET}" ]; then
              echo "::error::Existing tag ${TAG} resolves to ${ACTUAL}, expected ${TARGET}"
              exit 1
            fi
            echo "Tag ${TAG} already exists and resolves to the audited target ${TARGET}."
          else
            git tag -a "${TAG}" "${TARGET}" -m "v2.4.0 journal audit release"
            git push origin "refs/tags/${TAG}"
          fi

          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          ACTUAL="$(git rev-list -n 1 "${TAG}")"
          test "${ACTUAL}" = "${TARGET}"
          echo "Verified ${TAG} -> ${ACTUAL}"

      - name: Publish GitHub release from audited notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v2.4.0-journal-audit
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it unchanged."
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "v2.4.0 journal audit release" \
              --notes-file RELEASE_NOTES_v2.4.0-journal-audit.md
          fi

      - name: Final release verification
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v2.4.0-journal-audit
          TARGET: b027ee9cd310514ddb33b9c8af8b35a24cbe5d7f
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git rev-list -n 1 "${TAG}")" = "${TARGET}"
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName,name,isDraft,isPrerelease,url
